name: core-check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm run check:addon
      - name: Upload distributable addon
        uses: actions/upload-artifact@v4
        with:
          name: NEXY_FARVIEW_100-mcaddon
          path: NEXY_FARVIEW_100.mcaddon
          if-no-files-found: error
